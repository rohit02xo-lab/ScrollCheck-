name: Build ScrollCheck APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q ScrollCheckAndroid-CloudBuild.zip -d extracted
          cp -r extracted/ScrollCheckAndroid/. ./
          rm -rf extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin configuration
        shell: bash
        run: |
          FILE="app/build.gradle.kts"

          if [ -f "$FILE" ]; then
            sed -i \
              -e 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
              -e 's/JavaVersion\.VERSION_8/JavaVersion.VERSION_17/g' \
              -e 's/jvmTarget\s*=\s*"1\.8"/jvmTarget = "17"/g' \
              -e 's/jvmTarget\s*=\s*"8"/jvmTarget = "17"/g' \
              "$FILE"
          fi

          MAIN="app/src/main/java/com/scrollcheck/app/MainActivity.kt"

          if [ -f "$MAIN" ]; then
            if grep -q "AlertDialog" "$MAIN" && ! grep -q "import android.app.AlertDialog" "$MAIN"; then
              sed -i '/^import android\./i import android.app.AlertDialog' "$MAIN"
            fi
          fi

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScrollCheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
